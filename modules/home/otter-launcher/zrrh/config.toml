[general]
default_module = "app" # use app launcher by default
empty_module = "app" # run app launcher with empty prompt
exec_cmd = "bash -c" # exec command of your shell
vi_mode = true # set true to use vi keybinds, false emacs keybinds
esc_to_abort = true # useful for vi users
cheatsheet_entry = "?" # when prompted, will show a list of configured modules
cheatsheet_viewer = "less -R; clear" # command to show cheatsheet; through piping stdout
clear_screen_after_execution = false
loop_mode = false # don't quit after executing a module, useful with scratchpads; stderr is hidden in loop mode
external_editor = "nvim" # TUI editor for prompt editing (ctrl+x ctrl+e)
delay_startup = 0 # sometimes the otter runs too fast even before the terminal window is ready; this slows it down by milliseconds; useful when chafa image is skewed
callback = "exit" # close otter's terminal after module execution

[overlay]
# render image in overlay layer using chafa
overlay_cmd = "chafa -s x10 $HOME/.config/otter-launcher/nixos.png"
overlay_trimmed_lines = 1

[interface]
header = "  $USER@$(echo $HOSTNAME)     \u001B[31m\u001B[0m $(free -h | awk 'FNR == 2 {print $3}' | sed 's/i//')\n  "
list_prefix = "  "
selection_prefix = "\u001B[31;1m> "
place_holder = "type & search"
default_module_message = "  \u001B[33msearch\u001B[0m the internet"
suggestion_mode = "list"
suggestion_lines = 7
prefix_padding = 3
prefix_color = "\u001B[38;2;116;199;236m"
description_color = "\u001B[39m"
place_holder_color = "\u001B[90m"
hint_color = "\u001B[90m"

# move the interface
move_interface_right = 20
move_interface_down = 2

customized_list_order = true # false to list modules alphabetically; true to list as per the configured order in the below [[modules]] section
indicator_with_arg_module = "" # the sign showing whether a module should run with an argument
indicator_no_arg_module = ""

[[modules]]
description = "open dirs (yazi)"
prefix = "do"
cmd = """
find $HOME /mnt/media /mnt/games -maxdepth 3 -type d -not -path '*/.cache/*' -not -path '*/.git/*' 2>/dev/null | fzf --reverse --padding 1,3 --info-command 'printf " directories ($FZF_POS/$FZF_TOTAL_COUNT)"' --cycle --gutter ' ' --pointer ' ▌' --color 'bg+:-1,pointer:1,info:8,separator:8,scrollbar:0' --prompt '  ' | xargs -r -I [] niri msg action spawn -- ghostty -e yazi '[]'
"""

[[modules]]
description = "open files (fzf)"
prefix = "fo"
cmd = """
find $HOME /mnt/media /mnt/games -type f -not -path '*/.cache/*' 2>/dev/null | fzf --reverse --padding 1,3 --info-command 'printf " files ($FZF_POS/$FZF_TOTAL_COUNT)"' --cycle --gutter ' ' --pointer ' ▌' --color 'bg+:-1,pointer:1,info:8,separator:8,scrollbar:0' --prompt '  ' | xargs -r -I [] niri msg action spawn -- xdg-open '[]'
"""

[[modules]]
description = "nix search nixpkgs"
prefix = "nx"
cmd = "echo 'Searching nixpkgs for \"{}\"...' && nix search nixpkgs '{}' | less -R"
with_argument = true

[[modules]]
description = "search nixos wiki"
prefix = "nw"
cmd = "niri msg action spawn -- xdg-open 'https://nixos.wiki/index.php?search={}'"
with_argument = true
url_encode = true

[[modules]]
description = "search youtube"
prefix = "yt"
cmd = "niri msg action spawn -- xdg-open 'https://www.youtube.com/results?search_query={}'"
with_argument = true
url_encode = true

[[modules]]
description = "cambridge dict"
prefix = "dc"
cmd = "niri msg action spawn -- xdg-open 'https://dictionary.cambridge.org/dictionary/english/{}'"
with_argument = true
url_encode = true

[[modules]]
description = "calculate"
prefix = "calc"
cmd = "qalc '{}' | less"
with_argument = true

[[modules]]
description = "ChatGPT prompt"
prefix = "gpt"
with_argument = true
cmd = """
function chat {
    encoded="$(jq -sRr @uri)"
    niri msg action spawn -- xdg-open "https://chat.openai.com/?prompt=$encoded"
}
chat <<'EOF'
{}
EOF
"""

[[modules]]
description = "Claude prompt"
prefix = "claudi"
with_argument = true
cmd = """
function chat {
    encoded="$(jq -sRr @uri)"
    niri msg action spawn -- xdg-open "https://claude.ai/new?q=$encoded"
}
chat <<'EOF'
{}
EOF
"""

[[modules]]
description = "desktop applications (noctalia)"
prefix = "app"
cmd = "noctalia-shell ipc call launcher toggle"
unbind_proc = false

[[modules]]
description = "emoji picker (fzf)"
prefix = "em"
cmd = "fzf-emoji"

[[modules]]
description = "run commands"
prefix = "sh"
cmd = "niri msg action spawn -- ghostty -e fish -ic '{}'"
with_argument = true

[[modules]]
description = "google search"
prefix = "gg"
cmd = "niri msg action spawn -- xdg-open 'https://www.google.com/search?q={}'"
with_argument = true
url_encode = true

[[modules]]
description = "power menu (fzf)"
prefix = "po"
cmd = """
function power {
if [[ -n $1 ]]; then
case $1 in
"logout") session=`loginctl session-status | head -n 1 | awk '{print $1}'`; loginctl terminate-session $session ;;
"suspend") systemctl suspend ;;
"hibernate") systemctl hibernate ;;
"reboot") systemctl reboot ;;
"shutdown") systemctl poweroff ;;
esac fi }
power $(echo -e 'reboot\nshutdown\nlogout\nsuspend\nhibernate' | fzf --reverse --padding 1,2 --info-command 'printf " power menu ($FZF_POS/$FZF_TOTAL_COUNT)"' --cycle --gutter " " --pointer " ▌" --color "bg+:-1,pointer:1,info:8,separator:8,scrollbar:0" --prompt '  ' | tail -1)
"""
