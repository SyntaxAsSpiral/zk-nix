# One otter-launcher config for every host. Terminal-only: each module runs in the
# terminal otter was started in, using shell kit tools (fd, fzf, bat, eza, yazi, nano,
# glow, nh, lazygit, btop, rg). Run a module without the TUI: otter-launcher nx ripgrep
[general]
height = 14 # lines otter occupies: 1 padding, the 5-line header, the prompt, its rule, 5 modules, 1 padding
default_module = "gr" # text with no known prefix greps the current directory
empty_module = "fo" # Enter on an empty prompt picks a file
exec_cmd = "bash -c" # modules are bash
vi_mode = true # set true to use vi keybinds, false emacs keybinds
cheatsheet_entry = "?" # when prompted, will show a list of configured modules
cheatsheet_viewer = "less -R; clear" # command to show cheatsheet; through piping stdout
external_editor = "nano" # TUI editor for prompt editing (ctrl+x ctrl+e)

[interface]
header = "$(otter-header)"
padding = [1, 2, 1, 1] # top, right, bottom, left
list_prefix = "  "
selection_prefix = "\u001B[31;1m> "
prompt_sign = "@LOGO_ROW@  \u001B[38;2;116;199;236m \u001B[0m" # logo row 5, then nf-fa-search
prompt_sign_color = "reset"
placeholder = "search modules"
suggestion_mode = "list"
suggestion_position = "bottom" # the list sits below the prompt
prefix_padding = 3
prefix_color = "#74c7ec"


[[modules]]
description = "ssh to a tailnet host, pick one or name it (tailscale, fzf, jq)"
prefix = "sh"
cmd = "otter-ssh '{}'"
with_argument = true

[[modules]]
description = "open a git repo in lazygit (fd, fzf)"
prefix = "lg"
cmd = '''
sel=$(otter-fd --type d --max-depth 4 '^\.git$' | sed 's|/\.git/$||' | fzf --info-command 'printf " repos ($FZF_POS/$FZF_TOTAL_COUNT)"' --preview 'git -C {} log --oneline --color=always -n 20') || exit 0
lazygit -p "$sel"
'''


[[modules]]
description = "search beads issues from every workspace on this host (bd, fzf)"
prefix = "bd"
cmd = '''
export BD_JSON_ENVELOPE=1
otter-bd-list | fzf --delimiter '\t' --with-nth 2.. --header 'enter read in glow  ctrl-e edit  ctrl-n notes  ctrl-s claim  ctrl-x close (asks first)' --info-command 'printf " issues ($FZF_POS/$FZF_TOTAL_COUNT)"' --preview 'cd {1} && bd show {2} 2>/dev/null' --preview-window 'right,60%,wrap' --bind 'enter:execute(otter-bd-read {1} {2})' --bind 'ctrl-e:execute(cd {1} && EDITOR=nano bd edit {2})+reload(otter-bd-list)' --bind 'ctrl-n:execute(cd {1} && EDITOR=nano bd edit {2} --notes)+reload(otter-bd-list)' --bind 'ctrl-s:execute-silent(cd {1} && bd update {2} --claim)+reload(otter-bd-list)' --bind 'ctrl-x:execute(cd {1} && gum confirm "Close {2}?" && bd close {2})+reload(otter-bd-list)' > /dev/null
'''

[[modules]]
description = "open a file in glow, press e to edit in nano; markdown and short text files preview in glow (macchiato up to 200 lines, nord above), the rest in bat (fd, fzf, bat, glow)"
prefix = "fo"
cmd = '''
sel=$(otter-fd --type f --exclude .git . | fzf --info-command 'printf " files ($FZF_POS/$FZF_TOTAL_COUNT)"' --preview 'n=$(head -n 201 {} | wc -l); if case {} in *.md|*.markdown) true;; *) [ "$n" -le 200 ] && grep -Iq . {};; esac; then if [ "$n" -le 200 ]; then s=catppuccin-macchiato-custom; else s=nord-custom; fi; glow --style "$HOME/.config/glow/styles/$s.json" {} < /dev/null; else bat --color=always --style=numbers --line-range=:200 {}; fi') || exit 0
glow -t "$sel"
'''


[[modules]]
description = "open a directory in yazi (fd, fzf, eza)"
prefix = "do"
cmd = '''
sel=$(otter-fd --type d --max-depth 3 --exclude .git . | fzf --info-command 'printf " directories ($FZF_POS/$FZF_TOTAL_COUNT)"' --preview 'eza --tree --level=2 --icons=always --color=always {}') || exit 0
yazi "$sel"
'''


[[modules]]
description = "open a markdown file in glow, previews in macchiato up to 200 lines and nord above (fd, fzf)"
prefix = "md"
cmd = '''
sel=$(otter-fd --type f --extension md --exclude .git . | fzf --info-command 'printf " markdown ($FZF_POS/$FZF_TOTAL_COUNT)"' --preview 'n=$(head -n 201 {} | wc -l); if [ "$n" -le 200 ]; then s=catppuccin-macchiato-custom; else s=nord-custom; fi; glow --style "$HOME/.config/glow/styles/$s.json" {} < /dev/null') || exit 0
glow -t "$sel"
'''


[[modules]]
description = "search file contents in current directory, hidden files included, edit the match in nano (rg, fzf, bat)"
prefix = "gr"
with_argument = true
cmd = '''
sel=$(rg --line-number --no-heading --color=always --smart-case --hidden --glob '!.git/*' -- '{}' | fzf --ansi --delimiter : --info-command 'printf " matches ($FZF_POS/$FZF_TOTAL_COUNT)"' --preview 'bat --color=always --highlight-line {2} {1}' --preview-window '+{2}-5') || exit 0
file=${sel%%:*}
rest=${sel#*:}
nano "+${rest%%:*}" "$file"
'''


[[modules]]
description = "ask a model about a file: pick one, type a prompt (fd, fzf, bat, mods)"
prefix = "ai"
cmd = "otter-ask"

[[modules]]
description = "open system monitor (btop)"
prefix = "tp"
cmd = "btop"


[[modules]]
description = "search jolt's energy history by day or process (jolt, jq, fzf; adeck only)"
prefix = "jl"
cmd = "otter-jolt"

[[modules]]
description = "search nixpkgs as you type, enter opens nix shell (nh, fzf)"
prefix = "nx"
cmd = "otter-nx '{}'"
with_argument = true

[[modules]]
description = "search nushell commands by category or name, mouse works (nu tui)"
prefix = "nu"
cmd = "otter-nu"
