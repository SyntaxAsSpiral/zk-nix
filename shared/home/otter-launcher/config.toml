# One otter-launcher config for every host. Terminal-only: each module runs in the
# terminal otter was started in, using shell kit tools (fd, fzf, bat, eza, yazi, nano,
# glow, nh, lazygit, btop, rg). Run a module without the TUI: otter-launcher nx ripgrep
[general]
height = 25 # lines otter occupies: 1 padding, the 4-line header, the prompt, its rule, every module (17), 1 padding
default_module = "gr" # text with no known prefix greps the current directory
empty_module = "fo" # Enter on an empty prompt picks a file
exec_cmd = "bash -c" # modules are bash
vi_mode = true # set true to use vi keybinds, false emacs keybinds
cheatsheet_entry = "?" # when prompted, will show a list of configured modules
cheatsheet_viewer = "less -R; clear" # command to show cheatsheet; through piping stdout
external_editor = "nano" # TUI editor for prompt editing (ctrl+x ctrl+e)

[interface]
header = "$(otter-header)"
padding = [1, 0, 1, 1] # top, right, bottom, left
list_prefix = "  "
selection_prefix = "\u001B[31;1m> "
prompt_sign = "\u001B[34m \u001B[0m" # nf-fa-search
prompt_sign_color = "reset"
placeholder = "search modules"
suggestion_mode = "list"
suggestion_position = "bottom" # the list sits below the prompt
prefix_padding = 3
prefix_color = "\u001B[34m"
# Palette slot 7 for the module descriptions. Bright black (90) is too dark to read on a dark background.
description_color = "\u001B[37m"


[[modules]]
description = "Connect to a tailnet host (tailscale, fzf, jq)"
prefix = "ssh"
cmd = "otter-ssh '{}'"
with_argument = true

[[modules]]
description = "Open a git repo in lazygit (fd, gum)"
prefix = "lg"
cmd = '''
export GUM_FILTER_INDICATOR_FOREGROUND=4 GUM_FILTER_MATCH_FOREGROUND=5 GUM_FILTER_HEADER_FOREGROUND=8
sel=$(otter-fd --type d --max-depth 4 '^\.git$' | sed 's|/\.git/$||' | grep -v -E '/\.|/@' | sort | awk '{ for (p in seen) if (index($0, p "/") == 1) next; seen[$0] = 1; print }' | gum filter --header 'open in lazygit' --placeholder 'type to narrow' --height 12) || exit 0
lazygit -p "$sel"
'''


[[modules]]
description = "Search beads issues across workspaces (bd, fzf)"
prefix = "bd"
cmd = '''
export BD_JSON_ENVELOPE=1
otter-bd-list | fzf --delimiter '\t' --with-nth 2.. --header 'enter read in glow  ctrl-e edit  ctrl-n notes  ctrl-s claim  ctrl-x close (asks first)' --info-command 'printf " issues ($FZF_POS/$FZF_TOTAL_COUNT)"' --preview 'cd {1} && bd show {2} 2>/dev/null' --preview-window 'right,60%,wrap' --bind 'enter:execute(otter-bd-read {1} {2})' --bind 'ctrl-e:execute(cd {1} && EDITOR=nano bd edit {2})+reload(otter-bd-list)' --bind 'ctrl-n:execute(cd {1} && EDITOR=nano bd edit {2} --notes)+reload(otter-bd-list)' --bind 'ctrl-s:execute-silent(cd {1} && bd update {2} --claim)+reload(otter-bd-list)' --bind 'ctrl-x:execute(cd {1} && gum confirm "Close {2}?" && bd close {2})+reload(otter-bd-list)' > /dev/null
'''

[[modules]]
description = "Open a file in glow, edit in nano (fd, fzf, bat, glow)"
prefix = "fo"
cmd = '''
sel=$(otter-fd --type f --exclude .git . | fzf --info-command 'printf " files ($FZF_POS/$FZF_TOTAL_COUNT)"' --preview 'n=$(head -n 201 {} | wc -l); if case {} in *.md|*.markdown) true;; *) [ "$n" -le 200 ] && grep -Iq . {};; esac; then if [ "$n" -le 200 ]; then s=ansi-custom; else s=nord-custom; fi; glow --style "$HOME/.config/glow/styles/$s.json" {} < /dev/null; else bat --color=always --style=numbers --line-range=:200 {}; fi') || exit 0
glow -t "$sel"
'''


[[modules]]
description = "Open a directory in yazi (zoxide, fd, fzf, eza)"
prefix = "of"
cmd = '''
sel=$({ zoxide query --list; otter-fd --absolute-path --type d --max-depth 3 --exclude .git . ; } | sed 's|\(.\)/$|\1|' | awk '!seen[$0]++' | fzf --no-sort --info-command 'printf " directories ($FZF_POS/$FZF_TOTAL_COUNT)"' --preview 'eza --tree --level=2 --icons=always --color=always {}') || exit 0
yazi "$sel"
'''

[[modules]]
description = "Search file contents, edit the match in nano (rg, fzf, bat)"
prefix = "gr"
with_argument = true
cmd = '''
sel=$(rg --line-number --no-heading --color=always --smart-case --hidden --glob '!.git/*' -- '{}' | fzf --ansi --delimiter : --info-command 'printf " matches ($FZF_POS/$FZF_TOTAL_COUNT)"' --preview 'bat --color=always --highlight-line {2} {1}' --preview-window '+{2}-5') || exit 0
file=${sel%%:*}
rest=${sel#*:}
nano "+${rest%%:*}" "$file"
'''


[[modules]]
description = "Ask a model about a file (fd, fzf, bat, mods)"
prefix = "ai"
cmd = "otter-ask"

[[modules]]
description = "Start kmscon on a VT (kms)"
prefix = "kms"
cmd = "kms '{}'"
with_argument = true

[[modules]]
description = "Render text in figlet and toilet fonts (toilet, fzf, gum, tte)"
prefix = "fig"
cmd = "otter-fig '{}'"
with_argument = true

[[modules]]
description = "Say text as a cow, fortune if empty (cowsay, fortune, fzf, gum)"
prefix = "cow"
cmd = "otter-cow '{}'"
with_argument = true

[[modules]]
description = "Monitor the system (btop)"
prefix = "tp"
cmd = "btop"

[[modules]]
description = "Kill a process (ps, fzf, gum)"
prefix = "sp"
cmd = "otter-ps"

[[modules]]
description = "Manage a systemd unit (systemctl, fzf, gum)"
prefix = "sd"
cmd = "otter-sd"

[[modules]]
description = "Filter a json file live (fd, fzf, jq)"
prefix = "jq"
cmd = "otter-jq"


[[modules]]
description = "Search jolt energy history, adeck only (jolt, jq, fzf)"
prefix = "jl"
